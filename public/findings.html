<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Findings · Subscription Universe</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a; --surface: #141414; --surface-hover: #1a1a1a;
    --border: #222; --border-light: #2a2a2a;
    --text: #e0e0e0; --text-muted: #888; --text-dim: #666;
    --accent: #ff4444; --accent-dim: rgba(255,68,68,0.15);
    --ok: #3ddc84; --ok-dim: rgba(61,220,132,0.12);
    --warn: #ffb648; --warn-dim: rgba(255,182,72,0.12);
    --nav-h: 52px; --radius: 8px; --radius-sm: 5px; --transition: 150ms ease;
  }
  html { font-size: 14px; }
  body { background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  a { color: inherit; }

  /* NAV (same as index.html) */
  .nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 100;
    background: rgba(10,10,10,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; }
  .nav-brand { display: flex; align-items: center; gap: 10px; margin-right: 32px; text-decoration: none; flex-shrink: 0; }
  .nav-brand-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .nav-brand-icon svg { width: 14px; height: 14px; fill: white; }
  .nav-brand-text { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .nav-links { display: flex; align-items: center; gap: 2px; flex: 1; overflow-x: auto; }
  .nav-link { position: relative; display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: var(--radius-sm);
    text-decoration: none; font-size: 13px; font-weight: 500; color: var(--text-muted); transition: color var(--transition), background var(--transition); white-space: nowrap; }
  .nav-link:hover { color: var(--text); background: var(--surface-hover); }
  .nav-link.active { color: var(--accent); background: var(--accent-dim); }
  .nav-link svg { width: 15px; height: 15px; flex-shrink: 0; }
  @media (max-width: 640px) { .nav-brand-text { display: none; } .nav-brand { margin-right: 12px; } }

  main { max-width: 1180px; margin: 0 auto; padding: calc(var(--nav-h) + 24px) 20px 60px; }

  /* ASK */
  .ask { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .ask-row { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border-light); color: var(--text);
    border-radius: var(--radius-sm); padding: 11px 13px; font-size: 14px; outline: none; }
  .ask input:focus { border-color: var(--accent); }
  .ask button { background: var(--accent); color: #fff; border: 0; border-radius: var(--radius-sm); padding: 0 18px;
    font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .ask button:disabled { opacity: .5; cursor: wait; }
  .ask-status { margin-top: 10px; font-size: 12px; color: var(--text-dim); display: flex; gap: 14px; flex-wrap: wrap; }
  .ask-status b { color: var(--text-muted); font-weight: 500; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--text-dim); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--accent); }
  .readonly-note { font-size: 13px; color: var(--text-muted); }
  .readonly-note code { background: var(--bg); padding: 1px 6px; border-radius: 4px; color: var(--text); }
  .working { margin-top: 12px; font-size: 13px; color: var(--warn); display: none; }
  .working.show { display: block; }
  .error { margin-top: 12px; font-size: 13px; color: var(--accent); display: none; }
  .error.show { display: block; }

  /* TABS: one per finding */
  .tabs { display: flex; gap: 4px; margin: 22px 0 0; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: thin; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 13px; color: var(--text-muted);
    border: 1px solid transparent; border-bottom: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; cursor: pointer;
    white-space: nowrap; max-width: 260px; }
  .tab span.q { overflow: hidden; text-overflow: ellipsis; }
  .tab:hover { color: var(--text); background: var(--surface-hover); }
  .tab.active { color: var(--text); background: var(--surface); border-color: var(--border); margin-bottom: -1px; }
  .tab .x { color: var(--text-dim); font-size: 15px; line-height: 1; padding: 0 2px; }
  .tab .x:hover { color: var(--accent); }
  .vdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .v-found { background: var(--ok); } .v-thin { background: var(--warn); } .v-not_in_subs { background: var(--accent); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); padding: 20px; }
  .empty { color: var(--text-dim); text-align: center; padding: 48px 12px; font-size: 13px; }

  .verdict { border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px; }
  .verdict.found { background: var(--ok-dim); color: var(--ok); }
  .verdict.thin { background: var(--warn-dim); color: var(--warn); }
  .verdict.not_in_subs { background: var(--accent-dim); color: var(--accent); }
  .verdict a { font-weight: 600; }
  .intent { color: var(--text-muted); font-size: 13px; margin-bottom: 10px; }
  .meta { color: var(--text-dim); font-size: 12px; margin-bottom: 14px; }

  details.plan { margin-bottom: 18px; font-size: 12.5px; }
  details.plan summary { cursor: pointer; color: var(--text-muted); }
  .concept { margin-top: 10px; }
  .concept-name { color: var(--text-muted); font-weight: 600; margin-bottom: 5px; }
  .concept-name small { font-weight: 400; color: var(--text-dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { background: var(--bg); border: 1px solid var(--border-light); border-radius: 20px; padding: 2px 9px; color: var(--text-muted); }
  .chip.ex { border-color: rgba(255,68,68,.35); color: #e87; text-decoration: line-through; }

  h3 { font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 6px 0 10px; text-transform: uppercase; letter-spacing: .6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; text-decoration: none; transition: border-color var(--transition); display: block; }
  .card:hover { border-color: var(--border-light); }
  .thumb { aspect-ratio: 16/9; background: #111 center/cover no-repeat; position: relative; }
  .score { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.75); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
  .card-body { padding: 10px 11px 12px; }
  .card-title { font-size: 13px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-ch { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
  .card-why { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; font-style: italic; }
  .near { margin-top: 26px; }
  .near .grid { opacity: .75; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="index.html">
    <div class="nav-brand-icon">
      <svg viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
    </div>
    <span class="nav-brand-text">Subscription Universe</span>
  </a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
      Universe
    </a>
    <a class="nav-link" href="music.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      Music
    </a>
    <a class="nav-link" href="globe.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Globe
    </a>
    <a class="nav-link active" href="findings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Findings
    </a>
  </div>
</nav>

<main>
  <section class="ask" id="ask">
    <form class="ask-row" id="askForm">
      <input id="q" autocomplete="off" placeholder="Ask the agent, e.g. vlogs of people going through Amazonian forests">
      <button id="go" type="submit">Find in my subs</button>
    </form>
    <div class="ask-status" id="status"><span><span class="dot"></span>Checking for local agent…</span></div>
    <div class="working" id="working">Decomposing your request, searching your subscriptions, verifying matches…</div>
    <div class="error" id="error"></div>
  </section>

  <div class="tabs" id="tabs"></div>
  <section class="panel" id="panel"><div class="empty">No findings yet. Ask the agent above; each request becomes its own tab here.</div></section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let findings = [];
let activeId = null;
let agentOnline = false;

async function loadFindings() {
  try {
    const r = await fetch('./data/findings.json', { cache: 'no-store' });
    findings = r.ok ? await r.json() : [];
  } catch { findings = []; }
  if (!findings.find(f => f.id === activeId)) activeId = findings[0]?.id ?? null;
  render();
}

async function checkAgent() {
  const el = $('status');
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    if (!r.ok) throw 0;
    const s = await r.json();
    agentOnline = true;
    const idx = s.index
      ? `<span><b>Index</b> ${s.index.videos.toLocaleString()} videos · ${s.index.channels.toLocaleString()} channels · built ${new Date(s.index.built_at).toLocaleDateString()}</span>`
      : `<span style="color:var(--accent)">No video index. Run <b>npm run index</b> first.</span>`;
    const llm = s.llm
      ? `<span><span class="dot on"></span><b>Agent</b> ${esc(s.model)} via ${esc(s.provider)}</span>`
      : `<span><span class="dot off"></span><b>Agent</b> keyword-only (set OPENROUTER_API_KEY to enable decomposition + verification)</span>`;
    el.innerHTML = llm + idx;
    $('go').disabled = !s.index;
  } catch {
    agentOnline = false;
    $('askForm').style.display = 'none';
    el.innerHTML = `<span class="readonly-note">Read-only: the agent runs on your machine. Start it with <code>npm run agent</code> and open <code>http://localhost:8787/findings.html</code> to ask new questions.</span>`;
  }
}

$('askForm').addEventListener('submit', async e => {
  e.preventDefault();
  const query = $('q').value.trim();
  if (!query) return;
  $('go').disabled = true; $('working').classList.add('show'); $('error').classList.remove('show');
  try {
    const r = await fetch('/api/find', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ query }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    activeId = data.id;
    $('q').value = '';
    await loadFindings();
  } catch (err) {
    $('error').textContent = 'Agent error: ' + err.message;
    $('error').classList.add('show');
  } finally {
    $('go').disabled = false; $('working').classList.remove('show');
  }
});

async function removeFinding(id, ev) {
  ev.stopPropagation();
  if (!agentOnline) return;
  await fetch('/api/findings/' + id, { method: 'DELETE' });
  if (activeId === id) activeId = null;
  await loadFindings();
}

function render() {
  $('tabs').innerHTML = findings.map(f => `
    <div class="tab ${f.id === activeId ? 'active' : ''}" onclick="activeId='${f.id}';render()" title="${esc(f.query)}">
      <span class="vdot v-${f.verdict}"></span><span class="q">${esc(f.query)}</span>
      ${agentOnline ? `<span class="x" onclick="removeFinding('${f.id}', event)" title="Remove tab">×</span>` : ''}
    </div>`).join('');
  const f = findings.find(x => x.id === activeId);
  if (!f) { $('panel').innerHTML = `<div class="empty">No findings yet. Ask the agent above; each request becomes its own tab here.</div>`; return; }

  const wider = f.verdict !== 'found'
    ? ` <a href="${esc(f.wider_search)}" target="_blank" rel="noopener">Search all of YouTube instead →</a>` : '';
  const plan = f.concepts.map(c => `
    <div class="concept">
      <div class="concept-name">${esc(c.name)} <small>${c.required ? 'required' : 'optional'}</small></div>
      <div class="chips">${c.terms.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
    </div>`).join('') + (f.exclude.length ? `
    <div class="concept"><div class="concept-name">excluded <small>false friends</small></div>
      <div class="chips">${f.exclude.map(t => `<span class="chip ex">${esc(t)}</span>`).join('')}</div></div>` : '');

  $('panel').innerHTML = `
    <div class="verdict ${f.verdict}">${esc(f.summary)}${wider}</div>
    <div class="intent">Looking for: ${esc(f.intent)}</div>
    <div class="meta">${new Date(f.created_at).toLocaleString()} · ${f.stats.keyword_hits.toLocaleString()} keyword hits, ${f.verified ? 'verified by the agent' : 'not verified'} · ${f.elapsed_s}s</div>
    <details class="plan"><summary>How the request was decomposed</summary>${plan}</details>
    ${f.results.length ? `<h3>Results</h3><div class="grid">${f.results.map(card).join('')}</div>` : ''}
    ${f.near_misses.length ? `<div class="near"><h3>Nearest misses (related, not it)</h3><div class="grid">${f.near_misses.map(card).join('')}</div></div>` : ''}`;
}

function card(v) {
  const thumb = v.thumb || `https://i.ytimg.com/vi/${v.video_id}/mqdefault.jpg`;
  const date = v.published_at ? new Date(v.published_at).toLocaleDateString(undefined, { year: 'numeric', month: 'short' }) : '';
  return `<a class="card" href="https://www.youtube.com/watch?v=${esc(v.video_id)}" target="_blank" rel="noopener">
    <div class="thumb" style="background-image:url('${esc(thumb)}')"><span class="score">${'●'.repeat(v.score)}${'○'.repeat(3 - v.score)}</span></div>
    <div class="card-body">
      <div class="card-title">${esc(v.title)}</div>
      <div class="card-ch">${esc(v.channel_title)}${date ? ' · ' + date : ''}</div>
      ${v.why ? `<div class="card-why">${esc(v.why)}</div>` : ''}
    </div></a>`;
}

checkAgent().then(loadFindings);
</script>
</body>
</html>
